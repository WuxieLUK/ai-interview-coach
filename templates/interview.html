{% extends "base.html" %}
{% import "_icons.html" as ui %}
{% block title %}模拟面试 · AI 面试陪练{% endblock %}
{% block page %}interview{% endblock %}

{% block content %}
<div class="shell wrap">
  <header class="iv-head">
    <a class="crumb" href="{{ url_for('main.dashboard') }}">{{ ui.icon("arrow-left", 14) }} 返回</a>
    <h1 id="ivTitle" style="font-family:var(--serif);font-size:clamp(1.5rem,3vw,2.3rem);line-height:1.15;margin-top:1rem">模拟面试进行中</h1>
    <div class="iv-head__meta" id="ivMeta">
      <span class="badge badge--muted">加载中…</span>
    </div>
    <div class="progress"><div class="progress__fill" id="progressFill"></div></div>
  </header>

  <div id="stage">
    <div class="panel skeleton" style="max-width:760px">
      <i style="width:22%"></i><i style="width:78%;height:22px"></i><i style="width:100%;height:120px"></i><i style="width:35%"></i>
    </div>
  </div>
</div>
{% endblock %}
